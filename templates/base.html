<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Habit Tracker{% endblock %}</title>
    <meta name="description" content="Track your daily habits, build streaks, and earn XP. No login, no sign up, just open and go.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Habit Tracker">
    <meta property="og:description" content="Track your daily habits, build streaks, and earn XP. No login, no sign up, just open and go.">
    <meta property="og:image" content="https://xtekkis.pythonanywhere.com/static/icons/icon-512.png">
    <meta property="og:url" content="https://xtekkis.pythonanywhere.com/">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lucide.min.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#432B1E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Habits">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            {% block top_bar_content %}
            <h1 class="app-title">{% block page_title %}Today{% endblock %}</h1>
            {% endblock %}
        </header>
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
        <nav class="tab-bar">
            <div class="xp-bar-wrap" id="xp-bar">
                <div class="xp-bar-info">
                    <span class="xp-level-badge">Lv {{ player.level }}</span>
                    <span class="xp-rank-name">{{ player.rank }}</span>
                    <span class="xp-count">{{ player.xp }}/{{ player.xp_needed }} XP</span>
                </div>
                <div class="xp-bar-track">
                    <div class="xp-bar-fill" id="xp-bar-fill" data-pct="{{ player.pct }}"></div>
                </div>
            </div>
            <a href="/" class="tab-btn" id="tab-today">
                <i data-lucide="home" aria-hidden="true"></i>
                <span>Today</span>
            </a>
            <a href="/weekly" class="tab-btn" id="tab-insights">
                <i data-lucide="bar-chart-2" aria-hidden="true"></i>
                <span>Insights</span>
            </a>
            <button class="tab-fab" id="tab-fab" aria-label="Add habit">
                <i data-lucide="plus" aria-hidden="true"></i>
            </button>
            <a href="/calendar" class="tab-btn" id="tab-calendar">
                <i data-lucide="calendar" aria-hidden="true"></i>
                <span>Calendar</span>
            </a>
            <a href="/settings" class="tab-btn" id="tab-settings">
                <i data-lucide="settings" aria-hidden="true"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>
    <script>
        lucide.createIcons();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        // Apply per-element colors/widths from data attributes instead of
        // Jinja-interpolated inline styles, on every page.
        document.querySelectorAll('[data-color]').forEach(function(el) {
            el.style.background = el.dataset.color;
        });
        document.querySelectorAll('[data-pct]').forEach(function(el) {
            el.style.width = el.dataset.pct + '%';
        });

        // Global sheet helpers (used by index, settings, and any page with sheets)
        var sheetLastFocused = {};
        function openSheet(id) {
            var el = document.getElementById(id);
            if (!el) return;
            sheetLastFocused[id] = document.activeElement;
            el.classList.add('active');
            document.documentElement.classList.add('no-scroll');
            var panel = el.querySelector('.sheet');
            if (panel) {
                setTimeout(function() { panel.focus(); }, 50);
            }
        }
        function closeSheet(id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('active');
            if (!document.querySelector('.sheet-overlay.active')) {
                document.documentElement.classList.remove('no-scroll');
            }
            if (sheetLastFocused[id]) {
                sheetLastFocused[id].focus();
                sheetLastFocused[id] = null;
            }
        }

        // Active tab
        (function() {
            var path = window.location.pathname;
            if (path === '/') {
                document.getElementById('tab-today').classList.add('active');
            } else if (path.startsWith('/weekly') || path.startsWith('/monthly')) {
                document.getElementById('tab-insights').classList.add('active');
            } else if (path === '/calendar' || (path.startsWith('/habit/') && path.endsWith('/calendar'))) {
                document.getElementById('tab-calendar').classList.add('active');
            } else if (path === '/settings') {
                document.getElementById('tab-settings').classList.add('active');
            }
        })();

        // FAB wired here so tab-bar is already in DOM
        (function() {
            var fab = document.getElementById('tab-fab');
            if (!fab) return;
            fab.addEventListener('click', function() {
                var addSheet = document.getElementById('addSheet');
                if (addSheet) {
                    openSheet('addSheet');
                    setTimeout(function() {
                        var input = addSheet.querySelector('input[name="name"]');
                        if (input) input.focus();
                    }, 350);
                } else {
                    window.location.href = '/?add=1';
                }
            });
        })();
    </script>
</body>
</html>
